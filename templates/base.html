<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Cogniflow{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg:        #080c12;
      --surface:   #0d1420;
      --border:    #1a2540;
      --accent:    #00e5ff;
      --accent2:   #7c3aed;
      --green:     #00ffa3;
      --yellow:    #ffd60a;
      --red:       #ff4757;
      --text:      #e2e8f0;
      --muted:     #4a5568;
      --mono:      'Space Mono', monospace;
      --sans:      'Syne', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
    }

    /* Grid noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8,12,18,.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }

    .logo {
      font-family: var(--mono);
      font-size: 1.1rem;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-decoration: none;
    }

    .logo span { color: var(--text); }

    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: .85rem;
      letter-spacing: .05em;
      transition: color .2s;
    }

    nav a:hover { color: var(--accent); }

    main {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
    }

    .tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: .7rem;
      padding: .25rem .6rem;
      border-radius: 4px;
      letter-spacing: .05em;
    }

    .tag-high    { background: rgba(0,255,163,.12); color: var(--green);  border: 1px solid rgba(0,255,163,.3); }
    .tag-moderate{ background: rgba(255,214,10,.12); color: var(--yellow); border: 1px solid rgba(255,214,10,.3); }
    .tag-low     { background: rgba(255,71,87,.12);  color: var(--red);   border: 1px solid rgba(255,71,87,.3); }
    .tag-neutral { background: rgba(0,229,255,.12);  color: var(--accent); border: 1px solid rgba(0,229,255,.3); }

    .metric-row {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      margin-top: .75rem;
    }

    .metric {
      background: rgba(0,0,0,.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .5rem .85rem;
      font-family: var(--mono);
      font-size: .75rem;
    }

    .metric-val {
      color: var(--accent);
      font-weight: 700;
    }

    h1 { font-size: 1.75rem; font-weight: 800; }
    h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem; }
    h3 { font-size: 1rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-family: var(--mono); }

    .page-header {
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .glow { text-shadow: 0 0 20px var(--accent); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }
    .live-dot {
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s infinite;
      box-shadow: 0 0 6px var(--green);
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <a href="/" class="logo">COGNI<span>FLOW</span></a>
    <a href="/">Dashboard</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
